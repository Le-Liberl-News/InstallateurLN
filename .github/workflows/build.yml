# The two executables players download: Windows, and Linux (Steam Deck).
# Each is a single file. A "v…" tag publishes them as a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Linux xdelta3 is not used here, but include_bytes! wants the file on Linux only.
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packaging/windows/package-lock.json
      - run: npm ci --prefix packaging/windows
      - name: Compatible Setup for legacy Electron updates
        run: node scripts/package-windows.cjs
      - name: Check the legacy update bridge without installing it
        run: node scripts/test-windows-bridge.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/InstallateurLiberlNews.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            target/windows-setup/Installateur-du-Liberl-News-Setup-*.exe
            target/windows-setup/Installateur-du-Liberl-News-Setup-*.exe.blockmap
            target/windows-setup/latest.yml

  linux:
    # An older Ubuntu: its C library is older than SteamOS's, so the binary runs there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tools and xdelta3
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3 pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          # Shipped inside the executable (needs only libc and liblzma, both on SteamOS).
          cp /usr/bin/xdelta3 assets/xdelta3-linux
          ldd assets/xdelta3-linux
      - run: cargo test --release
      - run: cargo build --release
      - run: mv target/release/InstallateurLiberlNews target/release/InstallateurLiberlNews-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/InstallateurLiberlNews-linux

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x linux/InstallateurLiberlNews-linux
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Installateur ${GITHUB_REF_NAME}" \
            windows/InstallateurLiberlNews.exe linux/InstallateurLiberlNews-linux \
            windows-setup/Installateur-du-Liberl-News-Setup-*.exe \
            windows-setup/Installateur-du-Liberl-News-Setup-*.exe.blockmap windows-setup/latest.yml
